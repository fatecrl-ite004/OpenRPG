<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRPG - Controle de Sessão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar collapsed">
      <div class="brand">
        <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Recolher menu lateral">◀</button>
        <img src="img/icon.webp" alt="OpenRPG" class="brand-icon">
        <h1>OpenRPG</h1>
        <div id="sidebar-campanha" class="sidebar-campaign-info"></div>
      </div>
      <nav class="nav-menu">
        <a id="btn-tab-home" class="nav-btn" href="index.html">
          🏠 Início
        </a>
        <a id="btn-tab-sessao" class="nav-btn active" href="combate.html">
          ⚔️ Sessão / Combate
        </a>
        <a id="btn-tab-mestre" class="nav-btn" href="mestre.html">
          👑 Painel do Mestre
        </a>
        <a id="btn-tab-fichas" class="nav-btn" href="fichas.html">
          📄 Fichas de Personagem
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <button class="btn-open-sidebar" onclick="toggleSidebar()">
        ☰ Abrir Menu
      </button>
      
      <!-- Session & Combat -->
      <section class="section-container">
        <div class="section-header">
          <h2>⚔️ Controle de Sessão & Combate</h2>
          <p>Gerencie a iniciativa, vida, dor e munições dos personagens em combate.</p>
        </div>

        <div class="combat-bar">
          <div class="form-grid combat-bar-inputs">
            <input id="nome" class="c-inp-name" placeholder="Nome do Personagem / Inimigo">
            <input id="vida" type="number" class="c-inp-num" placeholder="Vida">
            <input id="inic" type="number" class="c-inp-num" placeholder="Inic">
            <input id="dor" type="number" class="c-inp-num" placeholder="Dor">
            <input id="arma1" class="c-inp-weapon" placeholder="Arma 1">
            <input id="arma2" class="c-inp-weapon" placeholder="Arma 2">
            <input id="arma3" class="c-inp-weapon" placeholder="Arma 3">
            <button onclick="adicionar()" class="btn-success c-btn-add">+ Adicionar</button>
          </div>
        </div>

        <div id="lista"></div>
      </section>

    </main>
  </div>

  <script>
    // State
    const campAtiva = JSON.parse(localStorage.getItem('openrpg_campanha_ativa') || 'null');
    const campKey = campAtiva ? `_${campAtiva.id}` : '';
    let personagens = JSON.parse(localStorage.getItem(`openrpg_personagens${campKey}`) || '[]');

    // Sidebar Toggle
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const isCollapsed = sidebar.classList.toggle('collapsed');
      localStorage.setItem('openrpg_sidebar_collapsed', isCollapsed);
    }

    function aplicarEstadoSidebar() {
      const saved = localStorage.getItem('openrpg_sidebar_collapsed');
      if (saved !== null) {
        document.getElementById('sidebar').classList.toggle('collapsed', saved === 'true');
      }
    }

    function carregarCampanhaSidebar() {
      const el = document.getElementById('sidebar-campanha');
      if (campAtiva && campAtiva.nome) {
        el.innerHTML = `<span class="camp-tag">🎲 ${campAtiva.nome}</span>`;
      } else {
        el.innerHTML = `<a href="index.html" class="camp-tag" style="text-decoration:none; border-color: var(--danger); color: var(--danger);">⚠️ Selecionar Campanha</a>`;
      }
    }

    // Combat
    function salvarCombate() {
      localStorage.setItem(`openrpg_personagens${campKey}`, JSON.stringify(personagens));
    }

    function adicionar() {
      const nome = document.getElementById('nome').value || 'Sem Nome';
      const vida = parseInt(document.getElementById('vida').value) || 0;
      const inic = parseInt(document.getElementById('inic').value) || 0;
      const dor = parseInt(document.getElementById('dor').value) || 0;
      const arma1 = document.getElementById('arma1').value || 'Arma 1';
      const arma2 = document.getElementById('arma2').value || 'Arma 2';
      const arma3 = document.getElementById('arma3').value || 'Arma 3';

      personagens.push({
        nome,
        vidaAtual: vida,
        vidaMax: vida,
        inic,
        dor,
        arma1, arma2, arma3,
        muni1: 0, max1: 0, lim1: 0,
        muni2: 0, max2: 0, lim2: 0,
        muni3: 0, max3: 0, lim3: 0
      });

      salvarCombate();
      renderCombate();
      document.querySelectorAll('.form-grid input').forEach(i => i.value = '');
    }

    function editarTexto(i, campo, valor) {
      personagens[i][campo] = valor;
      salvarCombate();
    }

    function atualizarVida(input, i) {
      const val = parseInt(input.value) || 0;
      personagens[i].vidaAtual = val;
      salvarCombate();
      const card = input.closest('.char-card');
      if (!card) return;
      const max = personagens[i].vidaMax || 1;
      const pct = max > 0 ? Math.max(0, Math.min(100, Math.round((val / max) * 100))) : 0;
      const isDead = val <= 0;
      card.classList.toggle('is-defeated', isDead);
      const pill = card.querySelector('.status-pill');
      if (pill) {
        pill.className = `status-pill ${isDead ? 'status-defeated' : 'status-active'}`;
        pill.textContent = isDead ? '💀 Caído' : '⚔️ Ativo';
      }
      const bar = card.querySelector('.health-fill');
      if (bar) {
        bar.style.width = pct + '%';
        bar.className = `health-fill ${pct > 50 ? 'health-high' : pct > 20 ? 'health-mid' : 'health-low'}`;
      }
    }

    function editarNumero(i, campo, valor) {
      personagens[i][campo] = parseInt(valor) || 0;
      salvarCombate();
      if (campo === 'vidaAtual' || campo === 'vidaMax' || campo === 'inic') {
        renderCombate();
      }
    }

    function duplicar(i) {
      personagens.push({ ...personagens[i], nome: personagens[i].nome + ' (Cópia)' });
      salvarCombate();
      renderCombate();
    }

    function remover(i) {
      personagens.splice(i, 1);
      salvarCombate();
      renderCombate();
    }

    function renderCombate() {
      personagens.sort((a, b) => b.inic - a.inic);
      const lista = document.getElementById('lista');
      lista.innerHTML = '';

      if (personagens.length === 0) {
        lista.innerHTML = `
          <div class="empty-combat-state">
            <span class="empty-combat-icon">🛡️</span>
            <h3>Nenhum combatente ativo</h3>
            <p>Cadastre heróis ou inimigos acima para acompanhar os turnos e a vida durante a sessão.</p>
          </div>
        `;
        return;
      }

      personagens.forEach((p, i) => {
        const vidaPct = p.vidaMax > 0 ? Math.max(0, Math.min(100, Math.round((p.vidaAtual / p.vidaMax) * 100))) : (p.vidaAtual > 0 ? 100 : 0);
        const isDefeated = p.vidaAtual <= 0;
        const healthLevel = vidaPct > 50 ? 'health-high' : (vidaPct > 20 ? 'health-mid' : 'health-low');

        lista.innerHTML += `
          <div class="char-card ${isDefeated ? 'is-defeated' : ''}">
            <div class="char-header">
              <div class="char-rank-badge" title="Posição na Iniciativa">#${i + 1}</div>
              <div class="char-name-container">
                <input class="char-name-input" value="${p.nome}" onchange="editarTexto(${i}, 'nome', this.value)" placeholder="Nome">
                <span class="status-pill ${isDefeated ? 'status-defeated' : 'status-active'}">
                  ${isDefeated ? '💀 Caído' : '⚔️ Ativo'}
                </span>
              </div>
              <div class="char-stats-row">
                <div class="stat-box stat-hp" title="Vida Atual">
                  <span class="stat-tag">🩸 Atual</span>
                  <input type="number" value="${p.vidaAtual}" oninput="atualizarVida(this, ${i})" onchange="editarNumero(${i}, 'vidaAtual', this.value)">
                </div>
                <div class="stat-box stat-max" title="Vida Máxima">
                  <span class="stat-tag">🫀 Máx</span>
                  <input type="number" value="${p.vidaMax}" onchange="editarNumero(${i}, 'vidaMax', this.value)">
                </div>
                <div class="stat-box stat-pain" title="Pontos de Dor">
                  <span class="stat-tag">💢 Dor</span>
                  <input type="number" value="${p.dor}" onchange="editarNumero(${i}, 'dor', this.value)">
                </div>
                <div class="stat-box stat-inic" title="Iniciativa">
                  <span class="stat-tag">🎯 Inic</span>
                  <input type="number" value="${p.inic}" onchange="editarNumero(${i}, 'inic', this.value)">
                </div>
              </div>
              <div class="char-actions">
                <button onclick="duplicar(${i})" class="btn-copy" title="Duplicar combatente">📋 Copiar</button>
                <button onclick="remover(${i})" class="btn-danger" title="Remover do combate">🗑️ Remover</button>
              </div>
            </div>

            <div class="health-track" title="Vida: ${p.vidaAtual} / ${p.vidaMax} (${vidaPct}%)">
              <div class="health-fill ${healthLevel}" style="width: ${vidaPct}%"></div>
            </div>

            <div class="weapons-grid">
              ${armaBox(i, p, 'arma1', 'muni1', 'max1', 'lim1', 1)}
              ${armaBox(i, p, 'arma2', 'muni2', 'max2', 'lim2', 2)}
              ${armaBox(i, p, 'arma3', 'muni3', 'max3', 'lim3', 3)}
            </div>
          </div>
        `;
      });
    }

    function armaBox(i, p, a, m, x, l, num = 1) {
      const icons = ['🗡️', '🔫', '🏹'];
      const icon = icons[(num - 1) % 3] || '⚔️';
      return `
        <div class="weapon-box">
          <div class="weapon-header">
            <span class="weapon-label">${icon} Arma ${num}</span>
            <input class="weapon-title-input" value="${p[a]}" onchange="editarTexto(${i}, '${a}', this.value)" placeholder="Nome da Arma">
          </div>
          <div class="weapon-stats-strip">
            <div class="weapon-stat-unit">
              <span class="weapon-unit-label">Munição</span>
              <input type="number" value="${p[m]}" onchange="editarNumero(${i}, '${m}', this.value)">
            </div>
            <div class="weapon-stat-unit">
              <span class="weapon-unit-label">Pente</span>
              <input type="number" value="${p[x]}" onchange="editarNumero(${i}, '${x}', this.value)">
            </div>
            <div class="weapon-stat-unit">
              <span class="weapon-unit-label">Total</span>
              <input type="number" value="${p[l]}" onchange="editarNumero(${i}, '${l}', this.value)">
            </div>
          </div>
        </div>
      `;
    }

    // Init
    window.onload = function() {
      aplicarEstadoSidebar();
      carregarCampanhaSidebar();
      renderCombate();
    };
  </script>
</body>
</html>
